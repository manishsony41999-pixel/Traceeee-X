version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: tracex-postgres
    restart: always
    environment:
      POSTGRES_DB: tracex_db
      POSTGRES_USER: tracex
      POSTGRES_PASSWORD: tracex_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracex -d tracex_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tracex-network

  # Redis for Caching and Workers
  redis:
    image: redis:7-alpine
    container_name: tracex-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tracex-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tracex-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://tracex:tracex_password@postgres:5432/tracex_db
      - REDIS_URL=redis://redis:6379/0
      - AI_PROVIDER=demo
      - USE_DEMO_INTELLIGENCE=true
      - DEBUG=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - tracex-network

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tracex-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - tracex-network

volumes:
  postgres_data:
  redis_data:

networks:
  tracex-network:
    driver: bridge
